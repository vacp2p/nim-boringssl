name: test

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux
            cpu: amd64
          - os: linux
            cpu: i386
          - os: linux-gcc-14
            cpu: amd64
          - os: macos-14
            cpu: arm64
          - os: windows
            cpu: amd64
        nim:
          - ref: version-2-2
            memory_management: refc
          - ref: version-2-2
            memory_management: orc
        include:
          - platform:
              os: linux
            builder: ubuntu-22.04
            shell: bash
          - platform:
              os: linux-gcc-14
            builder: ubuntu-24.04
            shell: bash
          - platform:
              os: macos-14
            builder: macos-14
            shell: bash
          - platform:
              os: windows
            builder: windows-2022
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    name: "${{ matrix.platform.os }}-${{ matrix.platform.cpu }} (Nim ${{ matrix.nim.ref }} --mm=${{ matrix.nim.memory_management }})"
    runs-on: ${{ matrix.builder }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Install llvm-mingw dependency (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p external
          MINGW_BASE="https://github.com/mstorsjo/llvm-mingw/releases/download/20230905"
          MINGW_URL="$MINGW_BASE/llvm-mingw-20230905-ucrt-x86_64.zip"
          curl -L "$MINGW_URL" -o "external/mingw-${{ matrix.platform.cpu }}.zip"
          7z x -y "external/mingw-${{ matrix.platform.cpu }}.zip" -oexternal/mingw-${{ matrix.platform.cpu }}/
          mv external/mingw-${{ matrix.platform.cpu }}/**/* ./external/mingw-${{ matrix.platform.cpu }}

      - name: Add llvm-mingw to path (Windows)
        if: >
          runner.os == 'Windows'
        run: |
          echo '${{ github.workspace }}'"/external/mingw-${{ matrix.platform.cpu }}/bin" >> $GITHUB_PATH
          echo "." >> $GITHUB_PATH

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Nim
        uses: "./.github/actions/install_nim"
        with:
          os: ${{ matrix.platform.os }}
          cpu: ${{ matrix.platform.cpu }}
          shell: ${{ matrix.shell }}
          nim_ref: ${{ matrix.nim.ref }}

      - name: Install deps
        run: |
          nimble install

      - name: Use gcc 14
        if: ${{ matrix.platform.os == 'linux-gcc-14'}}
        run: |
          # Add GCC-14 to alternatives
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14

          # Set GCC-14 as the default
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: Run tests
        run: |
          nim --version
          nimble --version
          gcc --version

          export NIMFLAGS="${NIMFLAGS} --mm:${{ matrix.nim.memory_management }}"

          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            export NIMFLAGS="${NIMFLAGS} --cc:clang"
          fi

          nimble test --styleCheck:off --verbose --debug

      - name: Checkout nim-libp2p
        uses: actions/checkout@v6
        with:
          repository: vacp2p/nim-libp2p
          path: downstream/nim-libp2p

      - name: Checkout nim-lsquic
        uses: actions/checkout@v6
        with:
          repository: vacp2p/nim-lsquic
          path: downstream/nim-lsquic
          submodules: "recursive"

      - name: Run nim-libp2p certificate compatibility check
        env:
          BORINGSSL_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BORINGSSL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DOWNSTREAM_ROOT: ${{ github.workspace }}/downstream
        run: |
          export NIMFLAGS="${NIMFLAGS:-} --mm:${{ matrix.nim.memory_management }}"

          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            export NIMFLAGS="${NIMFLAGS} --cc:clang"
          fi

          BORINGSSL_DEP="https://github.com/${BORINGSSL_REPO}.git#${BORINGSSL_COMMIT}"
          echo "Testing nim-libp2p against ${BORINGSSL_DEP}"

          update_boringssl_dependency() {
            local nimble_file="$1"
            local tmp_file="${nimble_file}.tmp"
            local repo_dep_re='"https://github\.com/vacp2p/nim-boringssl(\.git)?(#[^"]+|[[:space:]][^"]*)?"'
            local package_dep_re='"boringssl([[:space:]][^"]*)?"'
            local line updated=0

            : > "$tmp_file"
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ $updated -eq 0 && $line =~ $repo_dep_re ]]; then
                line="${line/${BASH_REMATCH[0]}/\"${BORINGSSL_DEP}\"}"
                updated=1
              elif [[ $updated -eq 0 && $line =~ $package_dep_re ]]; then
                line="${line/${BASH_REMATCH[0]}/\"${BORINGSSL_DEP}\"}"
                updated=1
              fi

              printf '%s\n' "$line" >> "$tmp_file"
            done < "$nimble_file"

            if [[ $updated -eq 0 ]]; then
              rm -f "$tmp_file"
              echo "Could not find a nim-boringssl dependency in ${nimble_file}" >&2
              return 1
            fi

            mv "$tmp_file" "$nimble_file"
            echo "Updated ${nimble_file} to depend on ${BORINGSSL_DEP}"
          }

          update_boringssl_pin() {
            local pin_file="$1"
            local tmp_file="${pin_file}.tmp"
            local pin_dep="boringssl;https://github.com/${BORINGSSL_REPO}@#${BORINGSSL_COMMIT}"
            local line updated=0

            : > "$tmp_file"
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ $updated -eq 0 && $line == boringssl\;* ]]; then
                line="$pin_dep"
                updated=1
              fi

              printf '%s\n' "$line" >> "$tmp_file"
            done < "$pin_file"

            if [[ $updated -eq 0 ]]; then
              rm -f "$tmp_file"
              echo "Could not find a boringssl pin in ${pin_file}" >&2
              return 1
            fi

            mv "$tmp_file" "$pin_file"
            echo "Updated ${pin_file} to depend on ${pin_dep}"
          }

          run_libp2p() {
            cd "${DOWNSTREAM_ROOT}/nim-libp2p" &&
              update_boringssl_dependency libp2p.nimble &&
              update_boringssl_pin .pinned &&
              nimble install_pinned &&
              "${MAKE_CMD:-make}" nimble.paths nat_libs &&
              "${MAKE_CMD:-make}" TEST_JOBS=1 test tests/libp2p/transports/tls/test_certificate.nim
          }

          if run_libp2p; then
            echo "nim-libp2p downstream compatibility check passed"
          else
            echo "::error title=Breaking downstream change::nim-libp2p failed to compile or pass the certificate test against ${BORINGSSL_DEP}; this PR is a breaking change."
            exit 1
          fi

      - name: Run nim-lsquic compatibility check
        env:
          BORINGSSL_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BORINGSSL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DOWNSTREAM_ROOT: ${{ github.workspace }}/downstream
        run: |
          export NIMFLAGS="${NIMFLAGS:-} --mm:${{ matrix.nim.memory_management }}"

          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            export NIMFLAGS="${NIMFLAGS} --cc:clang"
          fi

          BORINGSSL_DEP="https://github.com/${BORINGSSL_REPO}.git#${BORINGSSL_COMMIT}"
          echo "Testing nim-lsquic against ${BORINGSSL_DEP}"

          update_boringssl_dependency() {
            local nimble_file="$1"
            local tmp_file="${nimble_file}.tmp"
            local repo_dep_re='"https://github\.com/vacp2p/nim-boringssl(\.git)?(#[^"]+|[[:space:]][^"]*)?"'
            local package_dep_re='"boringssl([[:space:]][^"]*)?"'
            local line updated=0

            : > "$tmp_file"
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ $updated -eq 0 && $line =~ $repo_dep_re ]]; then
                line="${line/${BASH_REMATCH[0]}/\"${BORINGSSL_DEP}\"}"
                updated=1
              elif [[ $updated -eq 0 && $line =~ $package_dep_re ]]; then
                line="${line/${BASH_REMATCH[0]}/\"${BORINGSSL_DEP}\"}"
                updated=1
              fi

              printf '%s\n' "$line" >> "$tmp_file"
            done < "$nimble_file"

            if [[ $updated -eq 0 ]]; then
              rm -f "$tmp_file"
              echo "Could not find a nim-boringssl dependency in ${nimble_file}" >&2
              return 1
            fi

            mv "$tmp_file" "$nimble_file"
            echo "Updated ${nimble_file} to depend on ${BORINGSSL_DEP}"
          }

          run_lsquic() {
            cd "${DOWNSTREAM_ROOT}/nim-lsquic" &&
              update_boringssl_dependency lsquic.nimble &&
              nimble --nimbleDir:"${RUNNER_TEMP}/nimble-lsquic" --localdeps --accept install &&
              nimble --nimbleDir:"${RUNNER_TEMP}/nimble-lsquic" --localdeps test
          }

          if run_lsquic; then
            echo "nim-lsquic downstream compatibility check passed"
          else
            echo "::error title=Breaking downstream change::nim-lsquic failed to compile or pass tests against ${BORINGSSL_DEP}; this PR is a breaking change."
            exit 1
          fi
